server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types 
        text/plain 
        text/css 
        text/xml 
        text/javascript 
        application/x-javascript 
        application/xml 
        application/xml+rss 
        application/javascript 
        application/json 
        image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing — try .html extension first for SSG pre-rendered pages
    location / {
        # Try: exact file, file.html, directory/index.html, fallback to root index.html
        try_files $uri $uri.html $uri/index.html /index.html;
        default_type text/html;
    }

    # Explicitly catch 404s and return index.html with 200 status (critical for SPA SEO)
    error_page 404 =200 /index.html;

    # LI.FI API proxy — keeps API key server-side
    location /api/lifi/ {
        # Forward to LI.FI with API key header injected (key from env var)
        proxy_pass https://li.quest/v1/;
        proxy_set_header Host li.quest;
        proxy_ssl_server_name on;
        proxy_set_header X-Api-Key ${LIFI_API_KEY};
        proxy_set_header Accept application/json;
        # Strip our prefix and pass query strings through
        rewrite ^/api/lifi/(.*)$ /$1 break;
    }

    # Explicitly allow robots.txt and sitemap
    location = /robots.txt { allow all; log_not_found off; access_log off; }
    location = /sitemap.xml { allow all; log_not_found off; access_log off; }
}
