# Content negotiation: serve markdown to agents that ask for it
map $http_accept $markdown_ext {
    default "";
    ~*text/markdown ".md";
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Pre-compress: serve .gz files directly if available
    # (brotli_static requires a custom nginx build — not in stock nginx:alpine)
    gzip_static on;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/javascript
        application/json
        image/svg+xml;

    # Performance: disable access log for static assets, enable sendfile
    access_log off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    client_body_timeout 10;
    client_header_timeout 10;

    # Security headers (CSP + comprehensive)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Vary "Accept" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com https://cloud.umami.is; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https: wss:; frame-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # auth.md — agent registration discovery (markdown)
    location = /auth.md {
        default_type text/markdown;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # OAuth Protected Resource Metadata
    location = /.well-known/oauth-protected-resource {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # OAuth Authorization Server metadata
    location = /.well-known/oauth-authorization-server {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # RFC 9727 API catalog — linkset+json content type
    location = /.well-known/api-catalog {
        default_type application/linkset+json;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Vary "Accept" always;
    }

    # Homepage markdown negotiation: exact match so try_files
    # resolves /index.md before falling back to the index directive
    location = / {
        try_files /index$markdown_ext /index.html =404;
    }

    # Markdown content negotiation: correct content-type for .md responses
    location ~ \.md$ {
        default_type text/markdown;
        add_header Vary "Accept" always;
        add_header Content-Type "text/markdown; charset=utf-8" always;
    }

    # Service worker must always revalidate - a stale SW pins visitors
    # to old builds and dead pages. Matches any versioned name (sw.js,
    # sw-v4.js, ...) and must stay above the static-asset regex below.
    location ~ ^/sw[^/]*\.js$ {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # Cache static assets aggressively (hashed filenames = immutable)
    location ~* \.(js|css|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # HTML files: short cache + revalidation (content changes without hash)
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    # LI.FI API proxy — must come before location / catch-all
    location /api/lifi/ {
        resolver 8.8.8.8 1.1.1.1 valid=300s;
        resolver_timeout 5s;
        # Strip /api/lifi/ prefix, add /v1/ prefix
        # e.g. /api/lifi/tokens?chains=1 → https://li.quest/v1/tokens?chains=1
        rewrite ^/api/lifi/(.*)$ /v1/$1 break;
        proxy_pass https://li.quest;
        proxy_ssl_server_name on;
        proxy_set_header Host li.quest;
        # API key injected at build time by CI sed (placeholder replaced)
        proxy_set_header X-Api-Key "__LIFI_API_KEY__";
        proxy_set_header Accept application/json;
    }

    # SPA routing — every real route is prerendered to a static file, so an
    # unknown path is genuinely a 404 and must return a real 404 status
    # (soft-404s (200 + shell) previously made unknown URLs look valid).
    location / {
        default_type text/html;
        try_files $uri$markdown_ext $uri $uri.html $uri/index.html =404;
    }

    # Strip trailing slashes so /tools/ resolves like /tools
    # (try_files $uri.html doesn't match directories ending in /)
    rewrite ^/(.+)/$ /$1 permanent;

    # Removed product pages redirect to homepage
    location = /get-verified { return 301 /; }

    # Legacy unprefixed tool paths -> canonical /tools/ routes
    location = /agent-identity-generator { return 301 /tools/agent-identity-generator; }
    location = /local-token-counter { return 301 /tools/local-token-counter; }
    location = /markdown { return 301 /tools/markdown; }

    # Tool redirect routes (removed from router, handled at nginx level)
    location = /tools/xml-json-converter { return 301 /tools/xml-json; }
    location = /tools/xml-to-json { return 301 /tools/xml-json; }
    location = /tools/json-to-xml { return 301 /tools/xml-json; }

    # Legacy category slugs -> permanent redirects to new URLs
    location = /category/blockchain { return 301 /category/web3; }
    location = /category/crypto-security { return 301 /category/security; }
    location = /category/development { return 301 /category/developer; }
    location = /category/web-network { return 301 /category/network; }

    # Category index has no page - redirect to tools directory
    location = /category/ {
        return 301 /tools/all;
    }

    # Dynamic client-side routes (no prerendered file) get the SPA shell
    location ^~ /agents/ {
        try_files $uri $uri.html /index.html;
    }

    # Real 404 page with correct status code
    error_page 404 /404.html;

    # Explicitly allow robots.txt and sitemap
    location = /robots.txt { allow all; log_not_found off; access_log off; }
    location = /sitemap.xml { allow all; log_not_found off; access_log off; add_header Cache-Control "public, max-age=0, must-revalidate" always; }
    location = /manifest.json { allow all; log_not_found off; access_log off; }
}
