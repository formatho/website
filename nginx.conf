server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Pre-compress: serve .br and .gz files directly if available
    gzip_static on;
    brotli_static on;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/javascript
        application/json
        image/svg+xml;

    # Performance: disable access log for static assets, enable sendfile
    access_log off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    client_body_timeout 10;
    client_header_timeout 10;

    # Security headers (CSP + comprehensive)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com https://www.googletagmanager.com https://pagead2.googlesyndication.com https://cloud.umami.is; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https: wss:; frame-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # Cache static assets aggressively (hashed filenames = immutable)
    location ~* \.(js|css|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # HTML files: short cache + revalidation (content changes without hash)
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    # LI.FI API proxy — must come before location / catch-all
    location /api/lifi/ {
        resolver 8.8.8.8 1.1.1.1 valid=300s;
        resolver_timeout 5s;
        # Strip /api/lifi/ prefix, add /v1/ prefix
        # e.g. /api/lifi/tokens?chains=1 → https://li.quest/v1/tokens?chains=1
        rewrite ^/api/lifi/(.*)$ /v1/$1 break;
        proxy_pass https://li.quest;
        proxy_ssl_server_name on;
        proxy_set_header Host li.quest;
        # API key injected at build time by CI sed (placeholder replaced)
        proxy_set_header X-Api-Key "__LIFI_API_KEY__";
        proxy_set_header Accept application/json;
    }

    # SPA routing — try .html extension first for SSG pre-rendered pages
    location / {
        # Try: exact file, file.html, directory/index.html, fallback to root index.html
        try_files $uri $uri.html $uri/index.html /index.html;
        default_type text/html;
    }

    # Explicitly catch 404s and return index.html with 200 status (critical for SPA SEO)
    error_page 404 =200 /index.html;

    # Explicitly allow robots.txt and sitemap
    location = /robots.txt { allow all; log_not_found off; access_log off; }
    location = /sitemap.xml { allow all; log_not_found off; access_log off; add_header Cache-Control "public, max-age=3600"; }
    location = /manifest.json { allow all; log_not_found off; access_log off; }
}
