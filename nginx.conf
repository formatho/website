server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types 
        text/plain 
        text/css 
        text/xml 
        text/javascript 
        application/x-javascript 
        application/xml 
        application/xml+rss 
        application/javascript 
        application/json 
        image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # LI.FI API proxy — must come before location / catch-all
    location /api/lifi/ {
        resolver 8.8.8.8 1.1.1.1 valid=300s;
        resolver_timeout 5s;
        # Strip /api/lifi/ prefix, add /v1/ prefix
        # e.g. /api/lifi/tokens?chains=1 → https://li.quest/v1/tokens?chains=1
        rewrite ^/api/lifi/(.*)$ /v1/$1 break;
        proxy_pass https://li.quest;
        proxy_ssl_server_name on;
        proxy_set_header Host li.quest;
        # API key injected at build time by CI sed (placeholder replaced)
        proxy_set_header X-Api-Key "__LIFI_API_KEY__";
        proxy_set_header Accept application/json;
    }

    # SPA routing — try .html extension first for SSG pre-rendered pages
    location / {
        # Try: exact file, file.html, directory/index.html, fallback to root index.html
        try_files $uri $uri.html $uri/index.html /index.html;
        default_type text/html;
    }

    # Explicitly catch 404s and return index.html with 200 status (critical for SPA SEO)
    error_page 404 =200 /index.html;

    # Explicitly allow robots.txt and sitemap
    location = /robots.txt { allow all; log_not_found off; access_log off; }
    location = /sitemap.xml { allow all; log_not_found off; access_log off; }
}
