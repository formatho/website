name = "formatho-lead-capture"
main = "index.js"
compatibility_date = "2026-01-15"

routes = [
  # wildcard matters: the exact-path pattern does not match requests with
  # query strings (admin export uses ?key=...)
  { pattern = "formatho.com/api/subscribe*", custom_domain = false }
]

[[kv_namespaces]]
binding = "LEADS"
id = "df7cfe638206433aaa4c1643bcdeaa0d"

# Secrets (set via `wrangler secret put`, values also in .dev.vars for
# local dev): RESEND_API_KEY, LEADS_ADMIN_KEY.
# LEADS_LIST_ID can be a plain var — it is not secret.
[vars]
LEADS_LIST_ID = "updates@formatho.com"
