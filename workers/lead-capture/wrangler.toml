name = "formatho-lead-capture"
main = "index.js"
compatibility_date = "2026-01-15"

# Create the namespace first: wrangler kv:namespace create LEADS
# then paste the id below.
[[kv_namespaces]]
binding = "LEADS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Optional: forward each lead to a Resend email list.
# [vars] are public; secrets go in: wrangler secret put RESEND_API_KEY
# and: wrangler secret put LEADS_ADMIN_KEY (for GET /subscribe?key=... export)
# [vars]
# LEADS_LIST_ID = "updates@formatho.com"
