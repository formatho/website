services:
  app:
    image: ghcr.io/formatho/website:latest
    networks:
      - app-network
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 512M

networks:
  app-network:
    driver: overlay
    attachable: true
