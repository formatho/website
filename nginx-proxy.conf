# Performance Optimizations
# Increase buffer sizes to avoid temp file buffering
client_body_buffer_size 128k;
client_max_body_size 50m;
proxy_buffering on;
proxy_buffer_size 256k;
proxy_buffers 8 256k;
proxy_busy_buffers_size 512k;

# Enable HTTP/2 Push for critical assets
http2_push_preload on;

# 1. HTTP → HTTPS + Certbot ACME
server {
    listen 80;
    listen [::]:80;
    server_name formatho.com www.formatho.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect www to non-www
    location / {
        if ($host = www.formatho.com) {
            return 301 https://formatho.com$request_uri;
        }
        return 301 https://formatho.com$request_uri;
    }
}

# 2. www → non-www HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.formatho.com;

    ssl_certificate /etc/letsencrypt/live/formatho.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/formatho.com-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        return 301 https://formatho.com$request_uri;
    }
}

# 3. Main domain
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name formatho.com;

    ssl_certificate /etc/letsencrypt/live/formatho.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/formatho.com-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # TLS tuning
    ssl_session_cache shared:SSL:10m;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json image/svg+xml;

    # Performance: Increase proxy buffers for large assets
    proxy_buffer_size 256k;
    proxy_buffers 8 256k;
    proxy_busy_buffers_size 512k;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header Permissions-Policy "interest-cohort=()" always;

    # Static assets - aggressive caching (1 year)
    location ~* \.(js|css|png|jpg|jpeg|webp|svg|ico|woff2?|ttf|eot)$ {
        proxy_pass http://app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # /insights → /insights/ (preserve query)
    location = /insights {
        return 301 https://$host/insights/$is_args$args;
    }

    # WordPress
    location /insights/ {
        proxy_pass http://wordpress:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect ~^https?://[^/]+/(?!insights/)(.*)$ /insights/$1;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # SPA App - all other routes
    location / {
        proxy_pass http://app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # SPA fallback - serve index.html for client-side routing
        proxy_intercept_errors on;
        error_page 404 = @spa_fallback;
    }

    # Fallback to SPA entrypoint
    location @spa_fallback {
        rewrite .* /index.html break;
        proxy_pass http://app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# 4. API subdomain for AgentScan backend
server {
    listen 80;
    listen [::]:80;
    server_name api.formatho.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.formatho.com;

    ssl_certificate /etc/letsencrypt/live/formatho.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/formatho.com-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    access_log /var/log/nginx/api.formatho.com.access.log;
    error_log /var/log/nginx/api.formatho.com.error.log;

    location / {
        proxy_pass http://agenscan-indexer:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    location /api/v1/health {
        proxy_pass http://agenscan-indexer:8080/api/v1/health;
        access_log off;
    }
}
