name: MCP hosted tier (mcp.formatho.com)

# Runs the formatho/formatho-runtime public container on the Droplet and keeps
# it current: polls the runtime repo's latest release on a schedule, and can
# also be triggered instantly (repository_dispatch: runtime-release) or
# manually. Idempotent — safe to run repeatedly.

on:
  push:
    branches: [main]
    paths: ['.github/workflows/mcp-hosted.yml']
  schedule:
    - cron: '0 */6 * * *' # every 6h: pull :latest (rebuilt on every runtime release)
  workflow_dispatch:
  repository_dispatch:
    types: [runtime-release]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: digital_ocean_formatho
    steps:
      - name: Validate secrets
        run: |
          [ -n "${{ secrets.DO_HOST }}" ] || { echo "::error::DO_HOST not set"; exit 1; }
          [ -n "${{ secrets.DO_USERNAME }}" ] || { echo "::error::DO_USERNAME not set"; exit 1; }
          [ -n "${{ secrets.DO_SSH_KEY }}" ] || { echo "::error::DO_SSH_KEY not set"; exit 1; }

      - name: Deploy MCP runtime + nginx vhost
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            RUNTIME_DIR="$HOME/formatho-mcp"
            NGINX_CONF_DIR="$HOME/nginx/conf.d"
            mkdir -p "$RUNTIME_DIR" "$NGINX_CONF_DIR"

            # ---------- 1. container on the shared overlay network ----------
            echo '' | base64 -d > "$RUNTIME_DIR/docker-compose.yml"
            NET_NAME=$(docker network ls --filter driver=overlay --format '{{.Name}}' | grep -m1 'app-network')
            echo "joining overlay network: $NET_NAME"
            sed -i "s/formatho_net/$NET_NAME/" "$RUNTIME_DIR/docker-compose.yml"
            docker pull formatho/formatho-runtime:latest
            docker compose -f "$RUNTIME_DIR/docker-compose.yml" up -d --remove-orphans

            NGINX_CID=$(docker ps -qf name=nginx_nginx | head -1)
            reload_nginx() { docker exec "$NGINX_CID" nginx -s reload; }

            # ---------- 2. TLS cert (idempotent) ----------
            if [ ! -f "$HOME/.mcp-cert-done" ]; then
              echo '' | base64 -d > "$NGINX_CONF_DIR/45-mcp.conf"
              reload_nginx
              sleep 2
              docker run --rm -v letsencrypt:/etc/letsencrypt -v certbot-www:/var/www/certbot \
                certbot/certbot:latest certonly --webroot -w /var/www/certbot \
                -d mcp.formatho.com --non-interactive --agree-tos \
                --register-unsafely-without-email || true
              touch "$HOME/.mcp-cert-done"
            fi

            # ---------- 3. full https vhost ----------
            echo '' | base64 -d > "$NGINX_CONF_DIR/45-mcp.conf"
            if ! docker exec "$NGINX_CID" nginx -t 2>&1; then
              echo "nginx config test failed - cert may not have issued; rerun in a minute"
              exit 1
            fi
            reload_nginx
            echo "vhost installed and nginx reloaded"

      - name: Health check (https://mcp.formatho.com)
        run: |
          for i in $(seq 1 10); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" https://mcp.formatho.com/.well-known/mcp-server.json || echo 000)
            [ "$CODE" = "200" ] && { echo "mcp.formatho.com healthy"; exit 0; } || sleep 10
          done
          echo "::warning::health check did not pass yet (cert DNS propagation or first-run cert issuance can take a minute — rerun this workflow)"
          exit 0
