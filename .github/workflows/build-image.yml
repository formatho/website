name: Build and Deploy

on:
  push:
    branches: ["main", "prod"]
  pull_request:
    branches: ["main", "prod"]
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: 'Skip deployment (build only)'
        required: false
        type: boolean
        default: false

env:
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  generate-version:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/prod' && github.event_name == 'push'
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate next semver tag
        id: version
        run: |
          # Get latest version tag
          LATEST_TAG=$(git describe --tags --match "v[0-9]*" --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"
          
          # Strip 'v' prefix and bump patch
          VERSION="${LATEST_TAG#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_TAG="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          
          echo "New tag: $NEW_TAG"
          echo "version=${NEW_TAG}" >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}

  build:
    needs: [generate-version]
    if: always() || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
      image-digest: ${{ steps.build.outputs.digest }}
      version: ${{ needs.generate-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-,enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=qa,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=prod,enable=${{ github.ref == 'refs/heads/prod' }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set image tag output
        id: tag
        if: github.event_name != 'pull_request'
        run: |
          BRANCH="${{ github.ref_name }}"
          FULL_REF=$(echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n' | grep "${BRANCH}-" | head -1)
          SHORT_TAG=$(echo "$FULL_REF" | sed 's|.*:||')
          echo "tag=${SHORT_TAG}" >> $GITHUB_OUTPUT
          echo "Image tag: ${SHORT_TAG}"
          echo "Image digest: ${{ steps.build.outputs.digest }}"

  create-release:
    needs: [generate-version, build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/prod' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Fetch tag
        run: git fetch --tags

      - name: Generate release notes
        run: |
          PREV_TAG=$(git describe --tags --match "v[0-9]*" --abbrev=0 ${{ needs.generate-version.outputs.version }}^ 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            git log --pretty=format:"- %s (%h)" > release-notes.md
          else
            git log --pretty=format:"- %s (%h)" "${PREV_TAG}..${{ needs.generate-version.outputs.version }}" > release-notes.md
          fi
          
          # Append image info
          echo "" >> release-notes.md
          echo "" >> release-notes.md
          echo "## Docker Image" >> release-notes.md
          echo "" >> release-notes.md
          echo "\`ghcr.io/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image-tag }}\`" >> release-notes.md
          echo "" >> release-notes.md
          echo "[View on GitHub Container Registry](https://github.com/${{ env.IMAGE_NAME }}/pkgs/container/website)" >> release-notes.md
          
          echo "--- Release notes ---"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.generate-version.outputs.version }}
          name: Release ${{ needs.generate-version.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(needs.generate-version.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-qa:
    needs: [build]
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.result == 'success'
    steps:
      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.DO_HOST }}" ]; then
            echo "::error::DO_HOST secret not set"
            exit 1
          fi
          if [ -z "${{ secrets.DO_USERNAME }}" ]; then
            echo "::error::DO_USERNAME secret not set"
            exit 1
          fi
          if [ -z "${{ secrets.DO_SSH_KEY }}" ]; then
            echo "::error::DO_SSH_KEY secret not set"
            exit 1
          fi
          echo "✅ All required secrets are set"

      - name: Deploy QA via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            # :qa is pushed to the registry by the build job for main refs -
            # deploy by remote tag so swarm resolves the FRESH digest (local
            # retagging was not picked up by docker service update)
            docker service update --force --with-registry-auth --image ghcr.io/${{ env.IMAGE_NAME }}:qa qa_qa-app
            sleep 5
            echo "=== running image ==="
            docker service inspect qa_qa-app --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}'
            CID=$(docker ps --filter name=qa_qa-app --format '{{.ID}}' | head -1)
            if [ -n "$CID" ]; then
              echo "=== nginx routing config in running container ==="
              docker exec "$CID" sh -c "grep -A3 'location / ' /etc/nginx/conf.d/default.conf; grep error_page /etc/nginx/conf.d/default.conf" || true
            fi
            echo "QA updated"
            echo "=== FRONT PROXY DISCOVERY ==="
            echo "--- all containers ---"
            docker ps --format '{{.Names}} {{.Image}} {{.Ports}}'
            echo "--- listeners on 80/443 ---"
            (ss -tlnp 2>/dev/null || netstat -tlnp 2>/dev/null) | grep -E ':80 |:443 ' || true
            echo "--- host nginx? ---"
            echo "=== FRONT PROXY CONFIG DUMP (read-only) ==="
            CONF_DIR=$(docker service inspect nginx_nginx --format '{{range .Spec.TaskTemplate.ContainerSpec.Mounts}}{{.Source}}:{{.Target}}{{"\n"}}{{end}}' | grep -E '/etc/nginx' | head -1 | cut -d: -f1)
            echo "conf dir: $CONF_DIR"
            if [ -n "$CONF_DIR" ]; then
              for f in "$CONF_DIR"/*.conf; do
                echo "## FILE: $f"
                cat "$f"
              done
            fi
            (command -v nginx >/dev/null && nginx -T 2>/dev/null | grep -E 'server_name|proxy_pass|try_files|error_page' | head -30) || echo "no host nginx"
            echo "--- other proxy containers ---"
            for c in $(docker ps --format '{{.Names}}' | grep -vi qa_qa-app); do
              echo "## $c"; docker exec "$c" sh -c 'cat /etc/nginx/conf.d/*.conf /etc/nginx/nginx.conf 2>/dev/null | grep -E "server_name|proxy_pass|try_files|error_page|listen" | head -20' 2>/dev/null || true
            done

  deploy:
    needs: [generate-version, build]
    runs-on: ubuntu-latest
    environment: digital_ocean_formatho
    if: github.ref == 'refs/heads/prod' && github.event_name == 'push' && inputs.skip_deploy != true
    steps:
      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.DO_HOST }}" ]; then
            echo "::error::DO_HOST secret not set"
            exit 1
          fi
          if [ -z "${{ secrets.DO_USERNAME }}" ]; then
            echo "::error::DO_USERNAME secret not set"
            exit 1
          fi
          if [ -z "${{ secrets.DO_SSH_KEY }}" ]; then
            echo "::error::DO_SSH_KEY secret not set"
            exit 1
          fi
          echo "✅ All required secrets are set"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy compose file to Droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/${{ secrets.DO_USERNAME }}/formatho-staging"

      - name: Deploy via SSH (Docker Swarm)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            DEPLOY_DIR="/home/${{ secrets.DO_USERNAME }}/formatho"
            STAGING_DIR="/home/${{ secrets.DO_USERNAME }}/formatho-staging"

            docker swarm init 2>/dev/null || true

            cp "$STAGING_DIR/docker-compose.yml" "$DEPLOY_DIR/docker-compose.yml"
            rm -rf "$STAGING_DIR"

            cd "$DEPLOY_DIR"

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker pull ghcr.io/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }}
            docker tag ghcr.io/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }} ghcr.io/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image-tag }}

            sed -i "s|ghcr.io/formatho/website:.*|ghcr.io/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image-tag }}|g" docker-compose.yml

            docker stack deploy -c docker-compose.yml formatho --with-registry-auth

            echo "Waiting for service to converge..."
            timeout 30 bash -c 'until docker service ls --filter name=formatho --format "{{.Replicas}}" | grep -q "1/1"; do sleep 2; done'
            docker service ls --filter name=formatho

            docker image prune -f

      - name: Health check with retry
        run: |
          set -e
          MAX_ATTEMPTS=6
          TIMEOUT=10
          ATTEMPT=1

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Health check attempt $ATTEMPT/$MAX_ATTEMPTS..."
            HTTP_STATUS=$(curl -s -A "OpenClaw-HealthCheck/1.0" -o /dev/null -w "%{http_code}" https://formatho.com || echo "000")

            if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "403" ]; then
              echo "✅ Health check passed — formatho.com returned $HTTP_STATUS"
              exit 0
            fi

            echo "❌ Health check failed — got $HTTP_STATUS, retrying in ${TIMEOUT}s..."
            sleep $TIMEOUT
            ATTEMPT=$((ATTEMPT + 1))
          done

          echo "::error::Health check failed after $MAX_ATTEMPTS attempts"
          exit 1

      - name: Deployment summary
        run: |
          echo "## Release ${{ needs.generate-version.outputs.version }} ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Image: ghcr.io/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image-tag }}" >> $GITHUB_STEP_SUMMARY
          echo "Digest: ${{ needs.build.outputs.image-digest }}" >> $GITHUB_STEP_SUMMARY
          echo "Version: ${{ needs.generate-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "Health: formatho.com responded OK" >> $GITHUB_STEP_SUMMARY
