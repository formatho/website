name: Build and Deploy

on:
  push:
    branches: ["main", "prod"]
  pull_request:
    branches: ["main", "prod"]
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=prod,enable=${{ github.ref == 'refs/heads/prod' }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set image tag output
        id: tag
        if: github.event_name != 'pull_request'
        run: |
          BRANCH="${{ github.ref_name }}"
          # Extract just the short tag (e.g. prod-2acaf47) from the full ref
          FULL_REF=$(echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n' | grep "${BRANCH}-" | head -1)
          SHORT_TAG=$(echo "$FULL_REF" | sed 's|.*:||')
          echo "tag=${SHORT_TAG}" >> $GITHUB_OUTPUT
          echo "Image tag: ${SHORT_TAG}"
          echo "Image digest: ${{ steps.build.outputs.digest }}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: digital_ocean_formatho
    if: github.ref == 'refs/heads/prod' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy compose file to Droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/${{ secrets.DO_USERNAME }}/formatho-staging"

      - name: Deploy via SSH (Docker Swarm)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            DEPLOY_DIR="/home/${{ secrets.DO_USERNAME }}/formatho"
            STAGING_DIR="/home/${{ secrets.DO_USERNAME }}/formatho-staging"

            # Initialize Swarm if not already active
            docker swarm init 2>/dev/null || true

            # Sync config files
            cp "$STAGING_DIR/docker-compose.yml" "$DEPLOY_DIR/docker-compose.yml"
            rm -rf "$STAGING_DIR"

            cd "$DEPLOY_DIR"

            # Login to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull the exact image by digest
            docker pull ghcr.io/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }}

            # Tag it so docker-compose can reference it
            docker tag ghcr.io/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }} ghcr.io/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image-tag }}

            # Update image in compose file
            sed -i "s|ghcr.io/formatho/website:.*|ghcr.io/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image-tag }}|g" docker-compose.yml

            # Deploy via Swarm (creates or updates the stack)
            docker stack deploy -c docker-compose.yml formatho --with-registry-auth

            # Wait for service to be ready
            echo "Waiting for service to converge..."
            sleep 5
            docker service ls --filter name=formatho

            # Cleanup old images
            docker image prune -f

      - name: Health check
        run: |
          sleep 10
          HTTP_STATUS=$(curl -s -A "OpenClaw-HealthCheck/1.0" -o /dev/null -w "%{http_code}" https://formatho.com || echo "000")
          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "403" ]; then
            echo "::error::Health check failed! HTTP status: $HTTP_STATUS"
            exit 1
          fi
          echo "✅ Health check passed — formatho.com returned $HTTP_STATUS"

      - name: Deployment summary
        run: |
          echo "## Deployment Successful ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Image: ghcr.io/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image-tag }}" >> $GITHUB_STEP_SUMMARY
          echo "Digest: ${{ needs.build.outputs.image-digest }}" >> $GITHUB_STEP_SUMMARY
          echo "Branch: prod" >> $GITHUB_STEP_SUMMARY
          echo "Health: formatho.com responded OK" >> $GITHUB_STEP_SUMMARY
