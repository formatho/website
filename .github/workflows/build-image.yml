name: Build and Deploy

on:
  push:
    branches: ["main", "prod"]
  pull_request:
    branches: ["main", "prod"]
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Step 1: Generate Version
  generate-version:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/prod' && github.event_name == 'push'
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate next semver tag
        id: version
        run: |
          LATEST_TAG=$(git describe --tags --match "v[0-9]*" --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"
          
          VERSION="${LATEST_TAG#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_TAG="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          
          echo "New tag: $NEW_TAG"
          echo "version=${NEW_TAG}" >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}

  # Step 2: Build
  build:
    needs: [generate-version]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
      image-digest: ${{ steps.build.outputs.digest }}
      version: ${{ needs.generate-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=prod,enable=${{ github.ref == 'refs/heads/prod' }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set image tag output
        id: tag
        if: github.event_name != 'pull_request'
        run: |
          BRANCH="${{ github.ref_name }}"
          FULL_REF=$(echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n' | grep "${BRANCH}-" | head -1)
          SHORT_TAG=$(echo "$FULL_REF" | sed 's|.*:||')
          echo "tag=${SHORT_TAG}" >> $GITHUB_OUTPUT
          echo "Image tag: ${SHORT_TAG}"
          echo "Image digest: ${{ steps.build.outputs.digest }}"

  # Step 3: Create Release (prod only)
  create-release:
    needs: [generate-version, build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/prod' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Fetch tag
        run: git fetch --tags

      - name: Generate release notes
        run: |
          PREV_TAG=$(git describe --tags --match "v[0-9]*" --abbrev=0 ${{ needs.generate-version.outputs.version }}^ 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            git log --pretty=format:"- %s (%h)" > release-notes.md
          else
            git log --pretty=format:"- %s (%h)" "${PREV_TAG}..${{ needs.generate-version.outputs.version }}" > release-notes.md
          fi
          
          echo "" >> release-notes.md
          echo "" >> release-notes.md
          echo "## Docker Image" >> release-notes.md
          echo "" >> release-notes.md
          echo "`ghcr.io/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image-tag }}`" >> release-notes.md
          echo "" >> release-notes.md
          echo "[View on GitHub Container Registry](https://github.com/${{ env.IMAGE_NAME }}/pkgs/container/website)" >> release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.generate-version.outputs.version }}
          name: Release ${{ needs.generate-version.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(needs.generate-version.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Step 4: Deploy to QA (main branch only)
  deploy-qa:
    needs: [build]
    runs-on: ubuntu-latest
    environment: digital_ocean_formatho
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy QA via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ env.IMAGE_NAME }}:main
            docker tag ghcr.io/${{ env.IMAGE_NAME }}:main ghcr.io/${{ env.IMAGE_NAME }}:qa
            docker service update --force --image ghcr.io/${{ env.IMAGE_NAME }}:qa qa_qa-app
            echo "QA updated to main branch image"

  # Step 5: Verify — Scan QA site
  verify-qa:
    needs: [deploy-qa]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for QA deployment to settle
        run: sleep 15

      - name: QA Site Health Check
        run: |
          echo "## QA Site Verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Health check
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://qa.formatho.com || echo "000")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::QA health check failed! HTTP status: $HTTP_STATUS"
            exit 1
          fi
          echo "✅ Health check passed — qa.formatho.com returned $HTTP_STATUS" >> $GITHUB_STEP_SUMMARY

      - name: Scan QA site pages
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Page Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Scan key pages
          PAGES=(
            "/"
            "/tools"
            "/about"
            "/blogs"
            "/pricing"
          )
          
          for page in "${PAGES[@]}"; do
            URL="https://qa.formatho.com${page}"
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            SIZE=$(curl -s "$URL" | wc -c)
            if [ "$STATUS" = "200" ]; then
              echo "✅ \`$URL\` — Status: $STATUS, Size: ${SIZE} bytes" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ \`$URL\` — Status: $STATUS" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Scan QA site content
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Content Verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check homepage content
          HOMEPAGE=$(curl -s https://qa.formatho.com)
          
          # Check for key elements
          if echo "$HOMEPAGE" | grep -q "Formatho"; then
            echo "✅ Branding: 'Formatho' found on homepage" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Branding: 'Formatho' NOT found on homepage" >> $GITHUB_STEP_SUMMARY
          fi
          
          if echo "$HOMEPAGE" | grep -q "Developer Tools"; then
            echo "✅ Tagline: 'Developer Tools' found on homepage" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Tagline: 'Developer Tools' NOT found on homepage" >> $GITHUB_STEP_SUMMARY
          fi
          
          if echo "$HOMEPAGE" | grep -q "Skip to main content"; then
            echo "✅ Accessibility: Skip link found" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Accessibility: Skip link NOT found" >> $GITHUB_STEP_SUMMARY
          fi
          
          if echo "$HOMEPAGE" | grep -qi "aria-label"; then
            echo "✅ Accessibility: ARIA labels found" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Accessibility: ARIA labels NOT found" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Check tools page
          TOOLS_PAGE=$(curl -s https://qa.formatho.com/tools)
          if echo "$TOOLS_PAGE" | grep -qi "EXECUTE"; then
            echo "✅ Tools page: Execute buttons found" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Tools page: Execute buttons NOT found" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Count tools
          TOOL_COUNT=$(echo "$TOOLS_PAGE" | grep -oi "EXECUTE" | wc -l)
          echo "📊 Tools page: Found $TOOL_COUNT execute buttons" >> $GITHUB_STEP_SUMMARY

      - name: Scan QA site for errors
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Error Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          HOMEPAGE=$(curl -s https://qa.formatho.com)
          
          # Check for common error indicators
          if echo "$HOMEPAGE" | grep -qi "error\|exception\|undefined"; then
            echo "⚠️ Potential error indicators found in page source" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No error indicators found in homepage source" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Check for broken resources
          BROKEN=$(echo "$HOMEPAGE" | grep -oi 'src="[^"]*"' | sed 's/src="//;s/"//' | head -10)
          echo "📋 Resource references checked" >> $GITHUB_STEP_SUMMARY
          
          # Check response headers
          HEADERS=$(curl -sI https://qa.formatho.com)
          if echo "$HEADERS" | grep -qi "content-type: text/html"; then
            echo "✅ Content-Type: text/html confirmed" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Unexpected Content-Type header" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Generate QA scan report
        run: |
          mkdir -p qa-reports
          cat > qa-reports/scan-$(date +%Y%m%d-%H%M%S).md << 'REPORT'
          # QA Site Scan Report
          
          **Date:** $(date)
          **URL:** https://qa.formatho.com
          **Commit:** ${{ github.sha }}
          
          ## Summary
          
          Scan completed as part of the Build and Deploy workflow.
          
          ## Results
          
          See GitHub Actions summary above for detailed results.
          REPORT

      - name: Upload QA report
        uses: actions/upload-artifact@v4
        with:
          name: qa-scan-report
          path: qa-reports/
          retention-days: 30

  # Step 6: Deploy to Prod (prod branch only)
  deploy:
    needs: [generate-version, build]
    runs-on: ubuntu-latest
    environment: digital_ocean_formatho
    if: github.ref == 'refs/heads/prod' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy compose file to Droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/${{ secrets.DO_USERNAME }}/formatho-staging"

      - name: Deploy via SSH (Docker Swarm)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            DEPLOY_DIR="/home/${{ secrets.DO_USERNAME }}/formatho"
            STAGING_DIR="/home/${{ secrets.DO_USERNAME }}/formatho-staging"

            docker swarm init 2>/dev/null || true

            cp "$STAGING_DIR/docker-compose.yml" "$DEPLOY_DIR/docker-compose.yml"
            rm -rf "$STAGING_DIR"

            cd "$DEPLOY_DIR"

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker pull ghcr.io/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }}
            docker tag ghcr.io/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }} ghcr.io/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image-tag }}

            sed -i "s|ghcr.io/formatho/website:.*|ghcr.io/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image-tag }}|g" docker-compose.yml

            docker stack deploy -c docker-compose.yml formatho --with-registry-auth

            echo "Waiting for service to converge..."
            sleep 5
            docker service ls --filter name=formatho

            docker image prune -f

      - name: Health check
        run: |
          sleep 10
          HTTP_STATUS=$(curl -s -A "OpenClaw-HealthCheck/1.0" -o /dev/null -w "%{http_code}" https://formatho.com || echo "000")
          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "403" ]; then
            echo "::error::Health check failed! HTTP status: $HTTP_STATUS"
            exit 1
          fi
          echo "✅ Health check passed — formatho.com returned $HTTP_STATUS"

      - name: Deployment summary
        run: |
          echo "## Release ${{ needs.generate-version.outputs.version }} ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Image: ghcr.io/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image-tag }}" >> $GITHUB_STEP_SUMMARY
          echo "Digest: ${{ needs.build.outputs.image-digest }}" >> $GITHUB_STEP_SUMMARY
          echo "Version: ${{ needs.generate-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "Health: formatho.com responded OK" >> $GITHUB_STEP_SUMMARY
