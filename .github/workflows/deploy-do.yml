name: Deploy to DigitalOcean

# Deploy ONLY on push to prod branch or manual trigger
# main branch builds but does NOT deploy — it's the dev/testing branch
on:
  push:
    branches: ["prod"]
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: digital_ocean_formatho
    steps:
      - name: Download image metadata
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.run_id }}
          name: image-metadata-prod
          path: ./metadata

      - name: Read image metadata
        id: image
        run: |
          IMAGE_TAG=$(cat ./metadata/image-tag.txt)
          IMAGE_DIGEST=$(cat ./metadata/image-digest.txt)
          echo "tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "digest=${IMAGE_DIGEST}" >> $GITHUB_OUTPUT
          echo "Image tag: ${IMAGE_TAG}"
          echo "Image digest: ${IMAGE_DIGEST}"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy Files to Droplet (temp dir for atomic swap)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          source: "docker-compose.yml,nginx-proxy.conf"
          target: "/home/${{ secrets.DO_USERNAME }}/formatho-staging"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            DEPLOY_DIR="/home/${{ secrets.DO_USERNAME }}/formatho"
            STAGING_DIR="/home/${{ secrets.DO_USERNAME }}/formatho-staging"

            # Copy updated config files
            cp "$STAGING_DIR/docker-compose.yml" "$DEPLOY_DIR/docker-compose.yml"
            cp "$STAGING_DIR/nginx-proxy.conf" "$DEPLOY_DIR/nginx-proxy.conf"

            # Clean up staging
            rm -rf "$STAGING_DIR"

            cd "$DEPLOY_DIR"

            # Update docker-compose.yml to pin by digest (immutable)
            sed -i "s|ghcr.io/formatho/website:.*|ghcr.io/${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}|g" docker-compose.yml

            # Login to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull image by digest (guaranteed to be exact image built)
            docker pull ghcr.io/${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}

            # Tag it for docker-compose reference
            docker tag ghcr.io/${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }} ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}

            # Deploy
            docker compose up -d --force-recreate --remove-orphans
            docker exec nginx_proxy nginx -s reload || true

            # Cleanup old images
            docker image prune -f

      - name: Health check
        run: |
          sleep 10
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://formatho.com || echo "000")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Health check failed! HTTP status: $HTTP_STATUS"
            exit 1
          fi
          echo "✅ Health check passed — formatho.com returned 200"

      - name: Deployment summary
        run: |
          echo "## Deployment Successful ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`ghcr.io/${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`${{ steps.image.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`prod\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Health | formatho.com → 200 OK |" >> $GITHUB_STEP_SUMMARY
