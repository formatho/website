name: Deploy to DigitalOcean

on:
  workflow_run:
    workflows: ["Build Docker Image"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: digital_ocean_formatho
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: image
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "Using latest tag (manual trigger)"
          else
            # SHA is available in github.event.workflow_run.head_sha
            SHA="${{ github.event.workflow_run.head_sha }}"
            echo "tag=main-${SHA:0:7}" >> $GITHUB_OUTPUT
            echo "Using tag: main-${SHA:0:7}"
          fi

      - name: Clean up Theme Directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            rm -rf /home/${{ secrets.DO_USERNAME }}/formatho/formatho-theme

      - name: Copy Files to Droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          source: "docker-compose.yml,nginx-proxy.conf,formatho-theme,wordpress"
          target: "/home/${{ secrets.DO_USERNAME }}/formatho"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            cd /home/${{ secrets.DO_USERNAME }}/formatho

            # Update image tag in docker-compose.yml
            sed -i "s|ghcr.io/formatho/website:.*|ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}|g" docker-compose.yml

            # Login to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Inject LI.FI API key into nginx.conf
            sed -i "s/__LIFI_API_KEY__/${{ secrets.LIFI_API_KEY }}/g" nginx.conf

            # Pull new image
            docker pull ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}

            # Deploy
            docker compose up -d --force-recreate --remove-orphans
            docker compose restart wordpress
            docker exec nginx_proxy nginx -s reload || true

            # Cleanup
            docker image prune -f

      - name: Verify deployment
        run: |
          echo "Deployment completed successfully!"
          echo "Image: ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}"
          echo "Commit: ${{ github.sha }}"
