name: Deploy to DigitalOcean

on:
  workflow_run:
    workflows: ["Build Docker Image"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: digital_ocean_formatho
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Download image metadata
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          pattern: image-metadata
          path: ./metadata

      - name: Read image metadata
        id: image
        run: |
          IMAGE_TAG=$(cat ./metadata/image-tag.txt)
          IMAGE_DIGEST=$(cat ./metadata/image-digest.txt)
          echo "tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "digest=${IMAGE_DIGEST}" >> $GITHUB_OUTPUT
          echo "Image tag: ${IMAGE_TAG}"
          echo "Image digest: ${IMAGE_DIGEST}"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean up Theme Directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            rm -rf /home/${{ secrets.DO_USERNAME }}/formatho/formatho-theme

      - name: Copy Files to Droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          source: "docker-compose.yml,nginx-proxy.conf,formatho-theme,wordpress"
          target: "/home/${{ secrets.DO_USERNAME }}/formatho"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            cd /home/${{ secrets.DO_USERNAME }}/formatho

            # Update docker-compose.yml to pin by digest (immutable)
            sed -i "s|ghcr.io/formatho/website:.*|ghcr.io/${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}|g" docker-compose.yml

            # Login to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Inject LI.FI API key into nginx.conf
            sed -i "s/__LIFI_API_KEY__/${{ secrets.LIFI_API_KEY }}/g" nginx.conf

            # Pull image by digest (guaranteed to be exact image built)
            docker pull ghcr.io/${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}

            # Tag it for docker-compose reference
            docker tag ghcr.io/${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }} ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}

            # Deploy
            docker compose up -d --force-recreate --remove-orphans
            docker compose restart wordpress
            docker exec nginx_proxy nginx -s reload || true

            # Cleanup
            docker image prune -f

      - name: Verify deployment
        run: |
          echo "Deployment completed successfully!"
          echo "Image: ghcr.io/${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}"
          echo "Tag: ${{ steps.image.outputs.tag }}"
