      if (typeof globalThis !== 'undefined' && typeof globalThis.Buffer === 'undefined' && typeof window !== 'undefined' && typeof window.Buffer !== 'undefined') {
        globalThis.Buffer = window.Buffer;
      }
      if (typeof globalThis !== 'undefined' && typeof globalThis.Buffer === 'undefined') {
        // Retry after DOMContentLoaded (deferred CDN script may not have loaded yet)
        document.addEventListener('DOMContentLoaded', function() {
          if (typeof window.Buffer !== 'undefined' && typeof globalThis.Buffer === 'undefined') {
            globalThis.Buffer = window.Buffer;
          }
        });
      }
