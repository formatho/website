  <!-- Buffer polyfill - loaded async, self-assigns globally for crypto libs -->
  <!-- Vite plugin also polyfills Buffer in bundled chunks; this is a belt-and-suspenders fallback -->
  <script defer src="https://cdn.jsdelivr.net/npm/buffer@6.0.3/index.min.js"></script>
  <script>
    // Self-executing: if Buffer isn't set yet, check again on DOMContentLoaded
    (function ensureBuffer() {
      if (typeof globalThis !== 'undefined' && typeof globalThis.Buffer === 'undefined' && typeof window !== 'undefined' && typeof window.Buffer !== 'undefined') {
        globalThis.Buffer = window.Buffer;
      }
      if (typeof globalThis !== 'undefined' && typeof globalThis.Buffer === 'undefined') {
        // Retry after DOMContentLoaded (deferred CDN script may not have loaded yet)
        document.addEventListener('DOMContentLoaded', function() {
          if (typeof window.Buffer !== 'undefined' && typeof globalThis.Buffer === 'undefined') {
            globalThis.Buffer = window.Buffer;
          }
        });
      }
    })();
  </script>
